<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <!-- shell-redirect: forza l'uso di play.html per audio continuo -->
  <script>if(window.top===window){var f=location.pathname.split("/").pop()||"index.html";if(f!=="play.html"){location.replace("play.html?p="+encodeURIComponent(f+location.search));}}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d0e16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pokémon card game" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png" />
  <title>Pokémon Card Battle — Negozio</title>
  <link rel="stylesheet" href="css/base.css?v=8" />
  <link rel="stylesheet" href="css/shop.css?v=4" />
  <link rel="stylesheet" href="css/page-hero.css?v=1" />
  <link rel="preload" as="audio" href="assets/audio/menu.mp3" />
  <script src="js/register-sw.js?v=1" defer></script>
</head>
<body class="shop-page">

  <!-- Header -->
  <header class="page-hero page-hero--shop">
    <a class="page-hero__back" href="index.html" aria-label="Torna alla home">←</a>
    <div class="page-hero__logo">
      <span class="page-hero__ball" aria-hidden="true"></span>
      <div class="page-hero__text">
        <h1 class="page-hero__title">Negozio</h1>
        <p class="page-hero__tagline">Oggetti tenuti per i tuoi Pokémon</p>
      </div>
    </div>
    <div class="page-hero__extra shop-header__wallet">
      <div class="s-currency s-currency--euro">
        <span>🪙</span><span id="walletEuro">—</span>
      </div>
      <div class="s-currency s-currency--gems">
        <span>💎</span><span id="walletGems">—</span>
      </div>
    </div>
  </header>

  <!-- Categorie -->
  <div class="shop-tabs" id="shopTabs">
    <!-- popolato da JS -->
  </div>

  <!-- Search bar -->
  <div class="shop-search">
    <input type="search" id="shopSearch" placeholder="Cerca un oggetto…" autocomplete="off" />
  </div>

  <!-- Griglia oggetti -->
  <section class="shop-grid" id="shopGrid">
    <!-- popolata da JS -->
  </section>

  <!-- Empty state -->
  <div class="shop-empty hidden" id="shopEmpty">
    <p>Nessun oggetto corrisponde al filtro.</p>
  </div>

  <!-- Modal conferma acquisto -->
  <div class="modal hidden" id="buyModal" role="dialog" aria-modal="true">
    <div class="modal__backdrop" data-buy-close></div>
    <div class="modal__panel buy-panel">
      <div class="buy-panel__icon" id="buyIcon">🎁</div>
      <h2 class="buy-panel__name" id="buyName">—</h2>
      <p class="buy-panel__desc" id="buyDesc">—</p>
      <div class="buy-panel__price-row">
        <span class="buy-panel__price-label">Costo:</span>
        <span class="buy-panel__price-value" id="buyPrice">— 🪙</span>
      </div>
      <p class="buy-panel__after" id="buyAfter"></p>
      <div class="buy-panel__actions">
        <button class="btn" data-buy-close>Annulla</button>
        <button class="btn btn--primary" id="buyConfirm">✓ Acquista</button>
      </div>
    </div>
  </div>

  <!-- Toast feedback acquisto -->
  <div class="shop-toast hidden" id="shopToast">
    <span id="shopToastMsg"></span>
  </div>

  <script type="module" src="js/shop.js?v=4"></script>
</body>
</html>
