<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d0e16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pokémon card game" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png" />
  <title>Pokémon Card Battle — Summon</title>
  <link rel="stylesheet" href="css/base.css?v=8" />
  <link rel="stylesheet" href="css/summon.css?v=27" />
  <link rel="stylesheet" href="css/page-hero.css?v=1" />
  <link rel="preload" as="audio" href="assets/audio/menu.mp3" />
  <script src="js/register-sw.js?v=1" defer></script>
</head>
<body class="summon-page">

  <!-- Header -->
  <header class="page-hero page-hero--summon">
    <a class="page-hero__back" href="index.html" aria-label="Torna alla home">←</a>
    <div class="page-hero__logo">
      <span class="page-hero__ball" aria-hidden="true"></span>
      <div class="page-hero__text">
        <h1 class="page-hero__title">Summon</h1>
        <p class="page-hero__tagline">Apri pacchetti · Ottieni nuove carte</p>
      </div>
    </div>
    <div class="page-hero__extra summon-header__currencies">
      <div class="s-currency s-currency--gems">
        <span>💎</span><span id="walletGems">—</span>
      </div>
      <div class="s-currency s-currency--euro">
        <span>🪙</span><span id="walletEuro">—</span>
      </div>
    </div>
  </header>

  <!-- Banner card centrale -->
  <div class="banner-wrap">

    <!-- Frecce navigazione (future) -->
    <button class="banner-arrow banner-arrow--left" disabled aria-label="Banner precedente">‹</button>

    <section class="banner-card" id="bannerCard">

      <!-- Sfondo banner (gradiente placeholder, in futuro immagine regione) -->
      <div class="banner-card__bg" id="bannerBg">
        <div class="banner-card__bg-text">KANTO</div>
      </div>

      <!-- Pokémon in evidenza -->
      <div class="banner-card__featured" id="bannerFeatured"></div>

      <!-- Info overlay in basso -->
      <div class="banner-card__info">
        <div class="banner-card__info-left">
          <span class="banner-card__eyebrow">Banner attivo</span>
          <h2 class="banner-card__name">Kanto Standard</h2>
          <div class="banner-card__rate-pills">
            <span class="bc-pill bc-pill--pseudo">★★★★★ 0.3%</span>
            <span class="bc-pill bc-pill--epic">★★★★ 2%</span>
            <span class="bc-pill bc-pill--rare">★★★ 12%</span>
            <span class="bc-pill bc-pill--uncommon">★★ 30%</span>
            <span class="bc-pill bc-pill--common">★ 55.7%</span>
          </div>
        </div>
        <button class="banner-card__rates-btn" id="btnRates">
          Dettaglio probabilità ▸
        </button>
      </div>
    </section>

    <button class="banner-arrow banner-arrow--right" disabled aria-label="Banner successivo">›</button>
  </div>

  <!-- Pull buttons -->
  <div class="pull-actions">
    <button class="pull-btn" id="btnPull1">
      <span class="pull-btn__n">×1</span>
      <span class="pull-btn__cost" id="pull1Cost"><span>💎</span> 100</span>
    </button>
    <button class="pull-btn pull-btn--gold" id="btnPull10">
      <span class="pull-btn__n">×10</span>
      <span class="pull-btn__cost"><span>💎</span> 1000 <span class="pull-btn__tag">★★ garantito</span></span>
    </button>
  </div>

  <!-- Debug: forza rarità per test animazioni -->
  <div class="debug-actions">
    <span class="debug-actions__label">🧪 Debug animazioni:</span>
    <button class="debug-btn debug-btn--rare"    id="btnDebug3">Forza ★★★ Raro</button>
    <button class="debug-btn debug-btn--epic"    id="btnDebug4">Forza ★★★★ Epico</button>
    <button class="debug-btn debug-btn--pseudo"  id="btnDebug5">Forza ★★★★★ Pseudo Leggendario</button>
    <button class="debug-btn debug-btn--fakeout" id="btnDebugFakeout">🎭 Forza Fakeout 5★</button>
  </div>

  <!-- ================================================================
       MODAL CONFERMA
       ================================================================ -->
  <div class="modal hidden" id="confirmModal">
    <div class="modal__backdrop" id="confirmBackdrop"></div>
    <div class="modal__panel confirm-panel">
      <h2 class="confirm-panel__title" id="confirmTitle">Summon ×1</h2>
      <p class="confirm-panel__cost" id="confirmCost"></p>
      <p class="confirm-panel__after" id="confirmAfter"></p>
      <div class="confirm-panel__actions">
        <button class="btn" id="confirmCancel">Annulla</button>
        <button class="btn btn--primary" id="confirmOk">✓ Conferma</button>
      </div>
    </div>
  </div>

  <!-- ================================================================
       PULL OVERLAY — esperienza Star Rail
       ================================================================ -->
  <div class="pull-overlay hidden" id="pullOverlay">
    <div class="pull-overlay__bg" id="pullBg"></div>

    <!-- Skip button (visibile durante l'intera sequenza di pull) -->
    <button class="pull-skip-btn hidden" id="btnSkipPull">⏭ Skip</button>

    <!-- Hold-to-charge gate (solo multi ×10) -->
    <div class="pull-gate hidden" id="pullGate">
      <p class="pull-gate__hint">Tieni premuto per assorbire l'energia</p>
      <div class="pull-gate__circle">
        <svg viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="54" class="pull-gate__ring-bg"></circle>
          <circle cx="60" cy="60" r="54" class="pull-gate__ring-fill"></circle>
        </svg>
        <div class="pull-gate__pulse"></div>
      </div>
      <p class="pull-gate__sub">Rilascia per fermare la carica</p>
    </div>

    <!-- Screen 1: stelle animate -->
    <div class="stars-screen hidden" id="starsScreen">
      <div class="stars-screen__stars" id="starsRow"></div>
      <div class="stars-screen__name" id="starsName"></div>
    </div>

    <!-- Screen 2: Carta del Pokémon — artwork + dettagli -->
    <div class="reveal-screen hidden" id="revealScreen">
      <div class="reveal-screen__card" id="revealCard">
        <div class="reveal-screen__shine" aria-hidden="true"></div>
        <div class="reveal-screen__left" id="revealLeft">
          <div class="reveal-screen__glow" id="revealGlow"></div>
          <img class="reveal-screen__artwork" id="revealArtwork" alt="" />
          <img class="reveal-screen__sprite" id="revealSprite" alt="" />
        </div>
        <div class="reveal-screen__right" id="revealRight">
          <!-- riempito da JS -->
        </div>
      </div>
      <button class="reveal-screen__next" id="revealNext">Avanti →</button>
    </div>

    <!-- Screen 3: riepilogo -->
    <div class="summary-screen hidden" id="summaryScreen">
      <h2 class="summary-screen__title">Risultati</h2>
      <div class="summary-cards" id="summaryCards"></div>
      <button class="btn btn--primary summary-screen__close" id="pullClose">Continua →</button>
    </div>
  </div>

  <!-- ================================================================
       MODAL PROBABILITÀ
       ================================================================ -->
  <div class="modal hidden" id="ratesModal" role="dialog" aria-modal="true">
    <div class="modal__backdrop" id="ratesBackdrop"></div>
    <div class="modal__panel rates-panel">
      <div class="rates-panel__header">
        <h2 class="rates-panel__title">Probabilità di ottenimento</h2>
        <button class="rates-panel__close" id="btnRatesClose">✕</button>
      </div>
      <div class="rates-panel__body" id="ratesList"></div>
    </div>
  </div>

  <!-- Loading overlay -->
  <div class="summon-loading" id="loadingOverlay">
    <span class="loader"></span>
    <p>Caricamento Pokémon…</p>
  </div>

  <script type="module" src="js/summon.js?v=26"></script>
</body>
</html>
