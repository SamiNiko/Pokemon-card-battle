<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- PWA: lo shell è l'entry point ufficiale del gioco -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d0e16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pokémon card game" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png" />
  <title>Pokémon Card Battle</title>

  <!-- Preload aggressivo della traccia menu (è quella che parte subito) -->
  <link rel="preload" as="audio" href="assets/audio/menu.mp3" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0d0e16;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #fff;
    }
    #app {
      width: 100vw;
      height: 100vh;
      border: 0;
      display: block;
      background: #0d0e16;
    }
    /* Loader iniziale visibile finché l'iframe carica */
    #shell-loader {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #0d0e16;
      z-index: 10;
      transition: opacity 0.4s ease;
    }
    #shell-loader.is-hidden { opacity: 0; pointer-events: none; }
    .shell-pokeball {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, #ffcb05 0%, #ffcb05 30%, transparent 32%) center / 100% 100%,
        linear-gradient(180deg, #ee1515 0%, #ee1515 50%, #fff 50%, #fff 100%);
      border: 3px solid #0d0e16;
      box-shadow: 0 0 24px rgba(255, 203, 5, 0.5);
      animation: shell-pop 1.2s ease-in-out infinite;
    }
    @keyframes shell-pop {
      0%, 100% { transform: scale(1)    rotate(0);   }
      50%      { transform: scale(1.12) rotate(8deg); }
    }
  </style>
</head>
<body>

  <!-- Loader iniziale: rimosso quando l'iframe lancia il primo postMessage -->
  <div id="shell-loader" aria-hidden="true">
    <div class="shell-pokeball"></div>
  </div>

  <!-- Iframe full-screen che ospita TUTTE le pagine del gioco.
       I link dentro l'iframe (target=_self) restano nell'iframe,
       quindi l'outer document non si ricarica mai → audio persistente.
       L'src iniziale è impostato via script in base a ?p=... -->
  <iframe id="app" allow="autoplay; clipboard-read; clipboard-write" title="Gioco"></iframe>

  <!-- Routing: legge ?p=pagename per supporto deep-link/bookmark -->
  <script>
    (function() {
      const params = new URLSearchParams(location.search);
      const PAGE_WHITELIST = [
        'index.html', 'summon.html', 'collection.html', 'battle.html',
        'trainers.html', 'shop.html', 'settings.html', 'stats.html',
        'credits.html', 'online.html', 'story.html'
      ];
      let initial = params.get('p') ?? 'index.html';
      // Mantieni anche eventuali query params della pagina interna (es. battle?mode=trainer&id=oak)
      const querySplit = initial.split('?');
      const basename = querySplit[0];
      if (!PAGE_WHITELIST.includes(basename)) initial = 'index.html';
      document.getElementById('app').src = initial;
    })();
  </script>

  <!-- Logica dello shell: gestisce l'audio element + postMessage -->
  <script type="module" src="js/play.js?v=1"></script>
</body>
</html>
